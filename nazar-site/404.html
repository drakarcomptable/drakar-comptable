<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page introuvable | NAZAR</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="preload" href="/police-jakarta.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Plus Jakarta Sans';src:url(/police-jakarta.woff2) format('woff2');
  font-weight:200 800;font-style:normal;font-display:swap}
:root{--paper:#f4fbff;--ink:#004358;--steel:#44798a;--acc:#7fd8ee;--night:#00212c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:var(--paper);color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:34rem;text-align:center}
img{width:56px;height:56px;margin-bottom:28px}
p.code{margin:0 0 10px;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;
  font-weight:600;color:var(--steel)}
h1{margin:0 0 14px;font-size:clamp(1.6rem,5.2vw,2.2rem);font-weight:700;
  line-height:1.2;letter-spacing:-.02em}
p.dit{margin:0 0 32px;font-size:1.02rem;color:var(--steel)}
.liens{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a{display:inline-block;padding:13px 22px;border-radius:999px;text-decoration:none;
  font-weight:600;font-size:.96rem;transition:transform .15s ease,opacity .15s ease}
a:hover{transform:translateY(-1px)}
a.p{background:var(--night);color:#dff2f9}
a.s{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(0,67,88,.22)}
a:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/logo.png" width="56" height="56" alt="NAZAR">
  <p class="code">Erreur 404</p>
  <h1>Cette page n'existe pas, ou plus.</h1>
  <p class="dit">Le lien est peut-être ancien, ou l'adresse comporte une faute de frappe. Voici par où reprendre.</p>
  <div class="liens">
    <a class="p" href="/">Retour à l'accueil</a>
    <a class="s" href="/#rdv">Demander un audit gratuit</a>
  </div>
</main>
</body>
</html>
