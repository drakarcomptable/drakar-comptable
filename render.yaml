# Mise en ligne de DONETADOC, l'outil interne de propositions.
#
# Render est choisi parce que l'outil a besoin d'un vrai Chromium et d'une
# a deux minutes par document : une fonction sans etat ne tient ni la
# taille ni la duree.
#
# Le mot de passe n'est PAS ecrit ici. Il se saisit dans l'interface de
# Render, a la premiere mise en ligne. Sans lui, l'outil refuse de
# demarrer plutot que de s'ouvrir a tout vent : les documents qu'il
# fabrique portent des noms et des logos de clients.
services:
  - type: web
    name: donetadoc
    runtime: docker
    branch: claude/youthful-dirac-hq8gun   # la ou vivent ces fichiers
    # Mesure : lecture du site 575 Mo, photographie 638 Mo, rendu du PDF
    # 846 Mo. Les plans a 512 Mo (free, starter) ne tiennent pas, le
    # service serait tue en plein travail. Standard apporte 2 Go.
    plan: standard
    region: frankfurt
    dockerfilePath: ./proposition/Dockerfile
    dockerContext: .
    healthCheckPath: /sante    # « / » repond 401, Render le croirait mort
    autoDeploy: false
    envVars:
      - key: HOTE
        value: 0.0.0.0
      - key: DONETADOC_UTILISATEUR
        value: nazar
      - key: DONETADOC_MDP
        sync: false        # a saisir dans Render, jamais dans le depot
      # Pour un acces sans mot de passe, mettre DONETADOC_OUVERT a « oui »
      # et vider DONETADOC_MDP. L'outil devient alors accessible a quiconque
      # connait l'adresse : il fabrique des documents au nom de NAZAR, avec
      # les logos des clients, et chaque fabrication consomme la machine.
